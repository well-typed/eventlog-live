<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
	width="24"
	height="24"
	viewBox="0 0 24 24"
	version="1.1"
	id="eventlog-live-logo"
	xml:space="preserve"
	xmlns="http://www.w3.org/2000/svg">
    <style>
		circle.magnifying-glass {
			stroke: #333;
			stroke-width: 2;
			fill: none;
		}
		rect.magnifying-glass {
			fill: #333;
		}
        @media (prefers-color-scheme: dark) {
			circle.magnifying-glass {
				stroke: #a1af79;
			}
			rect.magnifying-glass {
				fill: #a1af79;
			}
        }
    </style>
	<defs>
		<path id="greater" d="M 0 0 L 4.25 0 L 8.5 9 L 4.25 18 L 0 18 L 4.25 9 Z" />
		<path id="lambda" d="M 0 0 L 4.25 0 L 8.5 9 L 12.75 18 L 9 18 L 6.375 12.5 L 4.25 18 L 0 18 L 4.25 9 Z" />
		<g id="equals">
			<rect x="0" y="0" width="10" height="3.75" />
			<rect x="0" y="4.75" width="10" height="3.75" />
		</g>
		<mask id="lambda_mask">
			<rect width="100%" height="100%" fill="white"/>
			<use style="fill:black" href="#lambda" x="-4.5" y="-4" />
		</mask>
		<use id="masked_equals" mask="url(#lambda_mask)" href="#equals"/>
		<mask id="lens_mask">
			<radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
				<stop offset="0%" stop-color="white" />
				<stop offset="100%" stop-color="black" />
			</radialGradient>
			<circle style="fill: url(#grad);" id="lens" cx="12.5" cy="8.5" r="12"/>
			<circle style="fill: white;" id="lens" cx="12.5" cy="8.5" r="8.5"/>
		</mask>
	</defs>
	<!-- Square Background (used for icon-X.png) -->
    <!-- <rect style="fill: #339989" x="0" y="0" width="24" height="24" rx="1" ry="1" /> -->
    <!-- Circle Background (used for favicon.ico and apple-icon.png) -->
    <!-- <circle style="fill: #339989" cx="12" cy="12" r="12" /> -->
	<!-- Uncomment for icon-mask.png -->
	<!-- <g transform="scale(0.79) translate(3,3)"> -->
	<g transform="rotate(45, 12, 12) translate(0, 3.5)">
		<!-- Haskell logo-->
		<g transform="translate(-0.75,0)" mask="url(#lens_mask)">
			<use style="fill: #453a62;" href="#greater" x="2.75" y="-0.5" />
			<use style="fill: #5e5086" href="#lambda" x="8" y="-0.5" />
			<use style="fill: #8f4e8b" href="#masked_equals" x="13.5" y="4" />
		</g>
		<!-- Magnifying Glass -->
		<circle class="magnifying-glass" id="lens" cx="12" cy="8.5" r="8.5"/>
		<rect class="magnifying-glass" x="20" y="7.25" width="6" height="2" rx="0.5" ry="0.5" />
	</g>
	<!-- Uncomment for icon-mask.png -->
	<!-- </g> -->
</svg>